{% extends "base.html" %}
{% block content %}
<div class="col-md-6 mx-auto">
  <div class="card job-card p-4">
    <h3>{{ seeker.user.username }}</h3>
    <p class="text-muted">{{ seeker.headline }}</p>
    <hr>
    <p><strong>Skills:</strong> {{ seeker.skills }}</p>
    <p><strong>Education:</strong> {{ seeker.education }}</p>
    <p><strong>Experience:</strong> {{ seeker.experience }}</p>
    <p><strong>Links:</strong> {{ seeker.links }}</p>
  </div>
</div>
{% endblock %}
