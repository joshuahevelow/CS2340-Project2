{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">My Applications</h2>
{% for app in apps %}
<div class="card job-card p-3 mb-3">
  <div class="d-flex justify-content-between align-items-center">
    <div>
      <h5 class="mb-1">{{ app.job.title }}</h5>
      <small class="text-muted">Applied {{ app.applied_at|date:"M d, Y" }}</small>
    </div>
    <span class="badge bg-secondary badge-status">{{ app.get_status_display }}</span>
  </div>
</div>
{% empty %}
<p>No applications yet</p>
{% endfor %}
{% endblock %}
